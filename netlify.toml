[build]
  command = "npm run build"
  publish = "dist"

# The backend middleware cannot set headers for this site: strolium.orbidefence.com
# is a different origin served by Netlify, so its headers come from here.
#
# Referrer-Policy matters most today. File and report URLs still carry a session
# token in the query string; no-referrer stops that URL being handed to any
# third-party origin in a Referer header.
#
# CSP notes:
#   * 'unsafe-inline' stays on style-src -- Vite inlines critical CSS and several
#     components set inline style attributes. Removing it blanks the layout.
#   * script-src does NOT need 'unsafe-inline': the Vite build emits external
#     bundles. telegram.org is required because Login.jsx injects
#     telegram-widget.js on demand for Telegram login.
#   * connect-src must list the API origin explicitly or every fetch is blocked.
#   * media-src and img-src allow the Supabase bucket the demo video is served
#     from -- without it the player is blocked and the login page looks broken.
#   * frame-src allows the Telegram login widget's iframe, and the YouTube host in
#     case the video is ever switched to an embed.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://api.strolium.orbidefence.com https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://api.strolium.orbidefence.com https://*.supabase.co https://web-production-91a2.up.railway.app; frame-src https://oauth.telegram.org https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
